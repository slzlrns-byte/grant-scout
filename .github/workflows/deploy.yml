name: deploy-dashboard

# 분석은 Claude 앱의 예약 작업(구독)이 수행하고 결과를 이 저장소에 푸시한다.
# 이 워크플로는 reports/ 가 바뀔 때 GitHub Pages 로 대시보드를 배포만 한다 (API 키 불필요).
on:
  push:
    branches: [main]
    paths: ["reports/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - id: deployment
        uses: actions/deploy-pages@v4
