name: weekly-scan

on:
  schedule:
    - cron: "0 0 * * 5"   # 매주 금요일 09:00 KST (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scan, analyze, export
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run weekly
      - name: Commit data and dashboard
        run: |
          git config user.name "grant-scout bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json reports/index.html reports/conditions.html
          git commit -m "weekly scan $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
